[project]
name = "copycat-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "fastapi==0.162.0",
    "openapi-core>=0.23.1",
    "pgvector>=0.5.1",
    "procrastinate>=3.10.0",
    "psycopg[binary]>=3.3.6",
    "pydantic[email]==2.14.2",
    "pydantic-settings==2.16.2",
    "pyjwt>=2.15.1",
    "pyoas[fastapi]>=0.8.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]==2.1.6",
    "uvicorn>=0.54.0",
    "boto3>=1.43.123",
    "httpx>=0.28.1",
]

[tool.pyright]
typeCheckingMode = "basic"
reportMissingTypeStubs = "error"         # Errors out if a library lacks type hints
reportUnknownArgumentType = "error"      # Blocks implicitly typed 'Any' arguments
reportUnknownLambdaType = "error"        # Blocks implicitly typed lambdas
reportUnknownVariableType = "error"      # Blocks variables that infer to 'Any'
reportUnknownMemberType = "error"        # Blocks accessing un-typed attributes
reportMissingParameterType = "error"     # Requires type hints for all function arguments
reportUnnecessaryIsInstance = "warning"  # Warns if an isinstance check is always True/False

pythonVersion = "3.12"

include = ["src", "test"]
exclude = ["**/node_modules", "**/__pycache__", ".venv"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio>=1.0.0",
    "httpx>=0.28.0",
    "ruff==0.17.3",
    "pyright>=1.1.414",
    "pre-commit>=4.7.0",
    "boto3-stubs[s3]>=1.43.123",
    "asyncpg-stubs>=0.32.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
